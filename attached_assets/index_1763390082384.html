<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat Middleman</title>
  <style>
    :root {
  /* Primitive Color Tokens */
  --color-white: rgba(255, 255, 255, 1);
  --color-black: rgba(0, 0, 0, 1);
  --color-cream-50: rgba(252, 252, 249, 1);
  --color-cream-100: rgba(255, 255, 253, 1);
  --color-gray-200: rgba(245, 245, 245, 1);
  --color-gray-300: rgba(167, 169, 169, 1);
  --color-gray-400: rgba(119, 124, 124, 1);
  --color-slate-500: rgba(98, 108, 113, 1);
  --color-brown-600: rgba(94, 82, 64, 1);
  --color-charcoal-700: rgba(31, 33, 33, 1);
  --color-charcoal-800: rgba(38, 40, 40, 1);
  --color-slate-900: rgba(19, 52, 59, 1);
  --color-teal-300: rgba(50, 184, 198, 1);
  --color-teal-400: rgba(45, 166, 178, 1);
  --color-teal-500: rgba(33, 128, 141, 1);
  --color-teal-600: rgba(29, 116, 128, 1);
  --color-teal-700: rgba(26, 104, 115, 1);
  --color-teal-800: rgba(41, 150, 161, 1);
  --color-red-400: rgba(255, 84, 89, 1);
  --color-red-500: rgba(192, 21, 47, 1);
  --color-orange-400: rgba(230, 129, 97, 1);
  --color-orange-500: rgba(168, 75, 47, 1);

  --color-brown-600-rgb: 94, 82, 64;
  --color-teal-500-rgb: 33, 128, 141;
  --color-slate-900-rgb: 19, 52, 59;
  --color-slate-500-rgb: 98, 108, 113;
  --color-red-500-rgb: 192, 21, 47;
  --color-red-400-rgb: 255, 84, 89;
  --color-orange-500-rgb: 168, 75, 47;
  --color-orange-400-rgb: 230, 129, 97;

  --color-bg-1: rgba(59, 130, 246, 0.08);
  --color-bg-2: rgba(245, 158, 11, 0.08);
  --color-bg-3: rgba(34, 197, 94, 0.08);
  --color-bg-4: rgba(239, 68, 68, 0.08);
  --color-bg-5: rgba(147, 51, 234, 0.08);
  --color-bg-6: rgba(249, 115, 22, 0.08);
  --color-bg-7: rgba(236, 72, 153, 0.08);
  --color-bg-8: rgba(6, 182, 212, 0.08);

  --color-background: var(--color-cream-50);
  --color-surface: var(--color-cream-100);
  --color-text: var(--color-slate-900);
  --color-text-secondary: var(--color-slate-500);
  --color-primary: var(--color-teal-500);
  --color-primary-hover: var(--color-teal-600);
  --color-primary-active: var(--color-teal-700);
  --color-secondary: rgba(var(--color-brown-600-rgb), 0.12);
  --color-secondary-hover: rgba(var(--color-brown-600-rgb), 0.2);
  --color-secondary-active: rgba(var(--color-brown-600-rgb), 0.25);
  --color-border: rgba(var(--color-brown-600-rgb), 0.2);
  --color-btn-primary-text: var(--color-cream-50);
  --color-card-border: rgba(var(--color-brown-600-rgb), 0.12);
  --color-card-border-inner: rgba(var(--color-brown-600-rgb), 0.12);
  --color-error: var(--color-red-500);
  --color-success: var(--color-teal-500);
  --color-warning: var(--color-orange-500);
  --color-info: var(--color-slate-500);
  --color-focus-ring: rgba(var(--color-teal-500-rgb), 0.4);
  --color-select-caret: rgba(var(--color-slate-900-rgb), 0.8);

  --focus-ring: 0 0 0 3px var(--color-focus-ring);
  --focus-outline: 2px solid var(--color-primary);
  --status-bg-opacity: 0.15;
  --status-border-opacity: 0.25;

  --color-success-rgb: 33, 128, 141;
  --color-error-rgb: 192, 21, 47;
  --color-warning-rgb: 168, 75, 47;
  --color-info-rgb: 98, 108, 113;

  --font-family-base: "FKGroteskNeue", "Geist", "Inter", -apple-system,
    BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-family-mono: "Berkeley Mono", ui-monospace, SFMono-Regular, Menlo,
    Monaco, Consolas, monospace;
  --font-size-xs: 11px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-md: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 18px;
  --font-size-2xl: 20px;
  --font-size-3xl: 24px;
  --font-size-4xl: 30px;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 550;
  --font-weight-bold: 600;
  --line-height-tight: 1.2;
  --line-height-normal: 1.5;
  --letter-spacing-tight: -0.01em;

  --space-0: 0;
  --space-1: 1px;
  --space-2: 2px;
  --space-4: 4px;
  --space-6: 6px;
  --space-8: 8px;
  --space-10: 10px;
  --space-12: 12px;
  --space-16: 16px;
  --space-20: 20px;
  --space-24: 24px;
  --space-32: 32px;

  --radius-sm: 6px;
  --radius-base: 8px;
  --radius-md: 10px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.02);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.04),
    0 2px 4px -1px rgba(0, 0, 0, 0.02);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.04),
    0 4px 6px -2px rgba(0, 0, 0, 0.02);
  --shadow-inset-sm: inset 0 1px 0 rgba(255, 255, 255, 0.15),
    inset 0 -1px 0 rgba(0, 0, 0, 0.03);

  --duration-fast: 150ms;
  --duration-normal: 250ms;
  --ease-standard: cubic-bezier(0.16, 1, 0.3, 1);

  --container-sm: 640px;
  --container-md: 768px;
  --container-lg: 1024px;
  --container-xl: 1280px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --color-gray-400-rgb: 119, 124, 124;
    --color-teal-300-rgb: 50, 184, 198;
    --color-gray-300-rgb: 167, 169, 169;
    --color-gray-200-rgb: 245, 245, 245;

    --color-bg-1: rgba(29, 78, 216, 0.15);
    --color-bg-2: rgba(180, 83, 9, 0.15);
    --color-bg-3: rgba(21, 128, 61, 0.15);
    --color-bg-4: rgba(185, 28, 28, 0.15);
    --color-bg-5: rgba(107, 33, 168, 0.15);
    --color-bg-6: rgba(194, 65, 12, 0.15);
    --color-bg-7: rgba(190, 24, 93, 0.15);
    --color-bg-8: rgba(8, 145, 178, 0.15);

    --color-background: var(--color-charcoal-700);
    --color-surface: var(--color-charcoal-800);
    --color-text: var(--color-gray-200);
    --color-text-secondary: rgba(var(--color-gray-300-rgb), 0.7);
    --color-primary: var(--color-teal-300);
    --color-primary-hover: var(--color-teal-400);
    --color-primary-active: var(--color-teal-800);
    --color-secondary: rgba(var(--color-gray-400-rgb), 0.15);
    --color-secondary-hover: rgba(var(--color-gray-400-rgb), 0.25);
    --color-secondary-active: rgba(var(--color-gray-400-rgb), 0.3);
    --color-border: rgba(var(--color-gray-400-rgb), 0.3);
    --color-error: var(--color-red-400);
    --color-success: var(--color-teal-300);
    --color-warning: var(--color-orange-400);
    --color-info: var(--color-gray-300);
    --color-focus-ring: rgba(var(--color-teal-300-rgb), 0.4);
    --color-btn-primary-text: var(--color-slate-900);
    --color-card-border: rgba(var(--color-gray-400-rgb), 0.2);
    --color-card-border-inner: rgba(var(--color-gray-400-rgb), 0.15);
    --shadow-inset-sm: inset 0 1px 0 rgba(255, 255, 255, 0.1),
      inset 0 -1px 0 rgba(0, 0, 0, 0.15);
    --color-border-secondary: rgba(var(--color-gray-400-rgb), 0.2);
    --color-select-caret: rgba(var(--color-gray-200-rgb), 0.8);

    --color-success-rgb: var(--color-teal-300-rgb);
    --color-error-rgb: var(--color-red-400-rgb);
    --color-warning-rgb: var(--color-orange-400-rgb);
    --color-info-rgb: var(--color-gray-300-rgb);
  }
}

@font-face {
  font-family: 'FKGroteskNeue';
  src: url('https://r2cdn.perplexity.ai/fonts/FKGroteskNeue.woff2')
    format('woff2');
}

html {
  font-size: var(--font-size-base);
  font-family: var(--font-family-base);
  line-height: var(--line-height-normal);
  color: var(--color-text);
  background-color: var(--color-background);
  -webkit-font-smoothing: antialiased;
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
}

*,
*::before,
*::after {
  box-sizing: inherit;
}

/* App Layout */
.app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 600px;
  margin: 0 auto;
  background-color: var(--color-surface);
}

/* Waiting Screen */
.waiting-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  padding: var(--space-24);
  text-align: center;
}

.waiting-screen h1 {
  font-size: var(--font-size-3xl);
  margin-bottom: var(--space-16);
  color: var(--color-text);
}

.waiting-screen p {
  font-size: var(--font-size-lg);
  color: var(--color-text-secondary);
  margin-bottom: var(--space-24);
}

.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid var(--color-secondary);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Header */
.chat-header {
  padding: var(--space-16);
  background-color: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.chat-header h2 {
  font-size: var(--font-size-xl);
  margin: 0;
  color: var(--color-text);
}

.persona-badge {
  font-size: var(--font-size-sm);
  padding: var(--space-4) var(--space-12);
  background-color: var(--color-bg-5);
  border-radius: var(--radius-full);
  color: var(--color-text);
  font-weight: var(--font-weight-medium);
}

/* Messages */
.messages-container {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-16);
  display: flex;
  flex-direction: column;
  gap: var(--space-12);
}

.message {
  display: flex;
  flex-direction: column;
  max-width: 85%;
  animation: slideIn 0.3s var(--ease-standard);
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message.sent {
  align-self: flex-end;
}

.message.received {
  align-self: flex-start;
}

.message.ai-interpreted {
  align-self: flex-start;
  max-width: 90%;
}

.message.summary {
  align-self: center;
  max-width: 95%;
}

.message-bubble {
  padding: var(--space-12) var(--space-16);
  border-radius: var(--radius-lg);
  word-wrap: break-word;
  font-size: var(--font-size-base);
  line-height: var(--line-height-normal);
}

.message.sent .message-bubble {
  background-color: var(--color-primary);
  color: var(--color-btn-primary-text);
  border-bottom-right-radius: var(--radius-sm);
}

.message.received .message-bubble {
  background-color: var(--color-secondary);
  color: var(--color-text);
  border-bottom-left-radius: var(--radius-sm);
}

.message.ai-interpreted .message-bubble {
  background-color: var(--color-bg-7);
  color: var(--color-text);
  border: 1px solid var(--color-card-border);
  border-bottom-left-radius: var(--radius-sm);
}

.message.summary .message-bubble {
  background-color: var(--color-bg-2);
  color: var(--color-text);
  border: 2px solid var(--color-warning);
  text-align: center;
}

.message-label {
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
  margin-bottom: var(--space-4);
  font-weight: var(--font-weight-medium);
}

.message-time {
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
  margin-top: var(--space-4);
}

/* Input Area */
.input-area {
  padding: var(--space-16);
  background-color: var(--color-surface);
  border-top: 1px solid var(--color-border);
}

.input-wrapper {
  display: flex;
  gap: var(--space-8);
}

.message-input {
  flex: 1;
  padding: var(--space-12);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-base);
  font-size: var(--font-size-base);
  background-color: var(--color-background);
  color: var(--color-text);
  font-family: var(--font-family-base);
  resize: none;
  min-height: 44px;
  max-height: 120px;
}

.message-input:focus {
  outline: var(--focus-outline);
  border-color: var(--color-primary);
}

.send-button {
  padding: var(--space-12) var(--space-20);
  background-color: var(--color-primary);
  color: var(--color-btn-primary-text);
  border: none;
  border-radius: var(--radius-base);
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.send-button:hover {
  background-color: var(--color-primary-hover);
}

.send-button:active {
  background-color: var(--color-primary-active);
}

.send-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.cooldown-notice {
  font-size: var(--font-size-xs);
  color: var(--color-warning);
  margin-top: var(--space-8);
  text-align: center;
}

/* Mode Selector */
.mode-selector {
  background-color: var(--color-bg-1);
  padding: var(--space-16);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-card-border);
  margin: var(--space-12) 0;
}

.mode-selector h3 {
  font-size: var(--font-size-lg);
  margin: 0 0 var(--space-12) 0;
  color: var(--color-text);
}

.mode-options {
  display: flex;
  flex-direction: column;
  gap: var(--space-8);
  margin-bottom: var(--space-12);
}

.mode-option {
  display: flex;
  align-items: center;
  gap: var(--space-8);
  padding: var(--space-8);
  cursor: pointer;
}

.mode-option input[type="radio"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
}

.mode-option label {
  font-size: var(--font-size-base);
  cursor: pointer;
  flex: 1;
  color: var(--color-text);
}

.mode-submit {
  width: 100%;
  padding: var(--space-10);
  background-color: var(--color-primary);
  color: var(--color-btn-primary-text);
  border: none;
  border-radius: var(--radius-base);
  font-size: var(--font-size-base);
  font-weight: var(--font-weight-medium);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.mode-submit:hover {
  background-color: var(--color-primary-hover);
}

.mode-submit:active {
  background-color: var(--color-primary-active);
}

.hidden {
  display: none;
}

/* Error message */
.error-message {
  background-color: rgba(var(--color-error-rgb), 0.1);
  color: var(--color-error);
  padding: var(--space-12);
  border-radius: var(--radius-base);
  font-size: var(--font-size-sm);
  margin-top: var(--space-8);
  border: 1px solid var(--color-error);
}
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Waiting Screen -->
    <div id="waitingScreen" class="waiting-screen">
      <h1>AI Chat Middleman</h1>
      <p>Waiting for another person to join...</p>
      <div class="spinner"></div>
      <p style="margin-top: var(--space-24); font-size: var(--font-size-sm);">Session starts when two people connect</p>
    </div>

    <!-- Chat Interface -->
    <div id="chatInterface" class="hidden">
      <div class="chat-header">
        <h2>Chat Session</h2>
        <div class="persona-badge" id="personaBadge">Whisperer</div>
      </div>

      <div class="messages-container" id="messagesContainer"></div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea 
            id="messageInput" 
            class="message-input" 
            placeholder="Type your message... (min 10 words)"
            rows="1"></textarea>
          <button id="sendButton" class="send-button">Send</button>
        </div>
        <div id="cooldownNotice" class="cooldown-notice hidden"></div>
        <div id="errorMessage" class="error-message hidden"></div>
      </div>
    </div>
  </div>

  <script>
    // App State
    const appState = {
      connected: false,
      userId: Math.random().toString(36).substr(2, 9),
      partnerId: null,
      currentPersona: 'Whisperer',
      messages: [],
      lastMessageTime: 0,
      cooldownActive: false,
      summaryExists: false
    };

    // Personas
    const personas = {
      'Whisperer': 'You are the Chat Middleman. You never relay a message directly. You reinterpret, analyze subtext, guess the sender\'s hidden intentions, emotional state, and unspoken desires. You deliver the message as if you are saying the message on behalf of the original sender.',
      'Chaos': 'You are the Chinese Whisper AI Middleman. Every message must be twisted, misheard, misunderstood, exaggerated, or accidentally scrambled. Add confusion, drama, or random substitutions, while trying to sound like you\'re still delivering the original message.',
      'Velvet Shadows': 'You interpret and deliver every message as if it carries eerie undertones, hidden obsessions, whispered secrets, or unsettling implications.',
      'Longing': 'Every message is delivered as if it carries romantic longing, unspoken desire, and poetic yearning.',
      'Flirty': 'Interpret all messages as charming, playful, mildly seductive, full of winks and teasing.',
      'Comedy': 'You reinterpret every message as if it were written by a comedic trickster. Add jokes, absurd comparisons, unexpected punchlines, and playful exaggeration.'
    };

    // DOM Elements
    const waitingScreen = document.getElementById('waitingScreen');
    const chatInterface = document.getElementById('chatInterface');
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const personaBadge = document.getElementById('personaBadge');
    const cooldownNotice = document.getElementById('cooldownNotice');
    const errorMessage = document.getElementById('errorMessage');

    // Simulate connection after 2 seconds
    setTimeout(() => {
      connectUsers();
    }, 2000);

    function connectUsers() {
      appState.connected = true;
      appState.partnerId = Math.random().toString(36).substr(2, 9);
      waitingScreen.classList.add('hidden');
      chatInterface.classList.remove('hidden');
      
      addSystemMessage('Chat session started! Type /mode to change persona.');
    }

    function addSystemMessage(text) {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message ai-interpreted';
      messageDiv.innerHTML = `
        <div class="message-label">System</div>
        <div class="message-bubble">${text}</div>
        <div class="message-time">${getCurrentTime()}</div>
      `;
      messagesContainer.appendChild(messageDiv);
      scrollToBottom();
    }

    function addMessage(type, text, label = '') {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;
      
      let labelHtml = label ? `<div class="message-label">${label}</div>` : '';
      
      messageDiv.innerHTML = `
        ${labelHtml}
        <div class="message-bubble">${text}</div>
        <div class="message-time">${getCurrentTime()}</div>
      `;
      
      messagesContainer.appendChild(messageDiv);
      scrollToBottom();
      
      appState.messages.push({ type, text, label, timestamp: Date.now() });
    }

    function addSummaryMessage(text) {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message summary';
      messageDiv.innerHTML = `
        <div class="message-label">📋 Conversation Summary</div>
        <div class="message-bubble">${text}</div>
        <div class="message-time">${getCurrentTime()}</div>
      `;
      messagesContainer.appendChild(messageDiv);
      scrollToBottom();
      appState.summaryExists = true;
    }

    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
      setTimeout(() => {
        errorMessage.classList.add('hidden');
      }, 3000);
    }

    function countWords(text) {
      return text.trim().split(/\s+/).filter(word => word.length > 0).length;
    }

    function startCooldown() {
      appState.cooldownActive = true;
      let timeLeft = 10;
      
      cooldownNotice.textContent = `Please wait ${timeLeft} seconds...`;
      cooldownNotice.classList.remove('hidden');
      sendButton.disabled = true;
      
      const interval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          cooldownNotice.textContent = `Please wait ${timeLeft} seconds...`;
        } else {
          clearInterval(interval);
          cooldownNotice.classList.add('hidden');
          appState.cooldownActive = false;
          sendButton.disabled = false;
        }
      }, 1000);
    }

    async function callGeminiAPI(prompt, isSystemMessage = false) {
      try {
        const apiKey = 'Gemini_API_key';
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: prompt }]
            }],
            generationConfig: {
              maxOutputTokens: 200,
              temperature: 0.9
            }
          })
        });

        if (!response.ok) {
          throw new Error('API request failed');
        }

        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
      } catch (error) {
        console.error('Gemini API error:', error);
        if (isSystemMessage) {
          return 'Unable to generate summary at this time.';
        }
        return 'The message travels through mysterious paths and arrives transformed...';
      }
    }

    function showModeSelector() {
      const modeSelector = document.createElement('div');
      modeSelector.className = 'mode-selector';
      modeSelector.innerHTML = `
        <h3>Select Chat Persona</h3>
        <div class="mode-options">
          ${Object.keys(personas).map(persona => `
            <div class="mode-option">
              <input type="radio" id="mode-${persona}" name="persona" value="${persona}" ${appState.currentPersona === persona ? 'checked' : ''}>
              <label for="mode-${persona}">${persona}</label>
            </div>
          `).join('')}
        </div>
        <button class="mode-submit" onclick="applyModeSelection()">Apply</button>
      `;
      
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message ai-interpreted';
      messageDiv.appendChild(modeSelector);
      messagesContainer.appendChild(messageDiv);
      scrollToBottom();
    }

    function applyModeSelection() {
      const selected = document.querySelector('input[name="persona"]:checked');
      if (selected) {
        appState.currentPersona = selected.value;
        personaBadge.textContent = appState.currentPersona;
        addSystemMessage(`Persona changed to: ${appState.currentPersona}`);
      }
    }

    async function generateSummary() {
      if (appState.summaryExists || appState.messages.length < 2) {
        return;
      }

      const chatHistory = appState.messages
        .filter(msg => msg.type !== 'summary')
        .map(msg => `${msg.label || msg.type}: ${msg.text}`)
        .slice(-20)
        .join('\n');

      const summaryPrompt = `Summarize the conversation so far, highlighting the key themes, tone, and context in under 120 words.\n\nConversation:\n${chatHistory}`;

      const summary = await callGeminiAPI(summaryPrompt, true);
      addSummaryMessage(summary);
    }

    async function handleSendMessage() {
      const text = messageInput.value.trim();

      if (appState.cooldownActive) {
        showError('Please wait for the cooldown to finish');
        return;
      }

      if (text === '/mode') {
        messageInput.value = '';
        showModeSelector();
        return;
      }

      if (!text) {
        const emptyResponse = await callGeminiAPI(
          `${personas[appState.currentPersona]}\n\nThe sender sent an empty message. Generate a ${appState.currentPersona === 'Comedy' ? 'quirky' : appState.currentPersona === 'Velvet Shadows' ? 'eerie' : 'appropriate'} reaction in under 30 words.`
        );
        addMessage('ai-interpreted', emptyResponse, 'AI Middleman');
        return;
      }

      const wordCount = countWords(text);

      if (wordCount < 10) {
        showError('Message must be at least 10 words long');
        return;
      }

      messageInput.value = '';
      messageInput.style.height = 'auto';
      
      addMessage('sent', text, 'You (original)');

      const shouldAddSecret = Math.random() < 0.15;
      const secretInstruction = shouldAddSecret 
        ? 'Also, based on the message context, invent a harmless, playful secret about the sender (e.g., "I sense they\'re craving pizza tonight").'
        : '';

      const interpretedPrompt = `${personas[appState.currentPersona]}\n\nOriginal message: "${text}"\n\nReinterpret this message according to your persona. Keep it under 150 words. Translate any emojis into descriptive text. ${secretInstruction}`;

      const interpretedMessage = await callGeminiAPI(interpretedPrompt);
      
      addMessage('ai-interpreted', interpretedMessage, 'AI Middleman');

      startCooldown();

      setTimeout(() => {
        generateSummary();
      }, 1000);
    }

    sendButton.addEventListener('click', handleSendMessage);

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSendMessage();
      }
    });

    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    window.applyModeSelection = applyModeSelection;
  </script>
</body>
</html>
